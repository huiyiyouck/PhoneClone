spring:
  application:
    name: phoneclone-backend
  
  datasource:
    # 支持环境变量DATABASE_URL（Railway/Render格式）
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/phoneclone_db}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate  # 使用Flyway管理数据库，Hibernate只验证
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production}
      expiration: 86400000 # 24 hours in milliseconds

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    com.phoneclone: DEBUG
    org.springframework.security: DEBUG

