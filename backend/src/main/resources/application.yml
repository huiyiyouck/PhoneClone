spring:
  application:
    name: phoneclone-backend
  
  datasource:
    # 支持环境变量DATABASE_URL（Railway/Render格式）
    # Supabase IPv6连接格式: jdbc:postgresql://db.dzxunppummwzfkdhlelh.supabase.co:5432/postgres?user=postgres&password=[YOUR_PASSWORD]
    # 如果只支持IPv6，JDBC驱动会自动使用IPv6解析域名
    # 使用方式：
    # 1. 直接设置完整URL: export SPRING_DATASOURCE_URL="jdbc:postgresql://db.dzxunppummwzfkdhlelh.supabase.co:5432/postgres?user=postgres&password=YOUR_PASSWORD"
    # 2. 或设置密码环境变量: export DB_PASSWORD="YOUR_PASSWORD" (会自动替换URL中的[YOUR_PASSWORD])
    url: jdbc:postgresql://db.dzxunppummwzfkdhlelh.supabase.co:5432/postgres
    username: postgres
    password: cqcet.19981025CK
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate  # 使用Flyway管理数据库，Hibernate只验证
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true  # 启用Flyway进行数据库迁移
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production}
      expiration: 86400000 # 24 hours in milliseconds

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    com.phoneclone: DEBUG
    org.springframework.security: DEBUG

# 应用初始化配置
app:
  init:
    test-users:
      enabled: true  # 是否启用测试账号初始化
      testuser:
        email: test@example.com
        password: 12345678
      vipuser:
        email: vip@example.com
        password: 12345678
      admin:
        email: admin@example.com
        password: admin123

